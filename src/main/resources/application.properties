# =====================================================================
# Main configuration for the GameFlix Auth Service (SPEC.md section 5).
# This file is committed to Git, so it holds placeholders only.
# The real values (MySQL user, MySQL password, JWT secret) come from
# application-local.properties in the project root (git-ignored) or from
# environment variables with the same names.
# =====================================================================

# Name the application reports in logs.
spring.application.name=gameflix-auth-service

# Load the git-ignored local secrets file from the project root, if it exists.
# "optional:" means startup does not fail just because the file is missing;
# it will fail later, with a clear message, if a ${...} value is still unresolved.
spring.config.import=optional:file:./application-local.properties

# JDBC URL for the existing "auth" database from Module 3 on the local MySQL server.
# allowPublicKeyRetrieval=true and useSSL=false match the course setup page and are
# for local development only. serverTimezone=UTC keeps stored timestamps in UTC.
spring.datasource.url=jdbc:mysql://localhost:3306/auth?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC

# MySQL login. ${...} is a placeholder filled from application-local.properties
# or an environment variable; the real value is never written in this file.
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}

# "update": Hibernate creates the users table if it is missing and keeps existing
# data between runs (needed for evidence). It never touches the Module 3 tables.
spring.jpa.hibernate.ddl-auto=update

# Turn off "open session in view" so database work happens only inside the
# service/repository layer, not while the HTTP response is being written.
spring.jpa.open-in-view=false

# JWT (JSON Web Token: a signed string that proves who the caller is) signing key.
# Must be a Base64 string that decodes to at least 32 bytes. No default on purpose:
# the app refuses to start without a real secret.
gameflix.jwt.secret=${JWT_SECRET}

# How long a login token stays valid, in seconds (900 = 15 minutes).
gameflix.jwt.ttl-seconds=900

# The single browser origin allowed to call this API through CORS
# (Cross-Origin Resource Sharing). Defaults to the planned frontend on port 8081.
gameflix.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:8081}

# SECURITY: when a duplicate email is registered, Hibernate logs MySQL's message at WARN level,
# and that message contains the submitted email (Duplicate entry 'x@y.com' for key ...).
# Showing only ERROR and above for this logger keeps users' emails out of the log. The 409 is
# still returned; GlobalExceptionHandler reads the constraint name from the exception itself.
logging.level.org.hibernate.orm.jdbc.error=ERROR
