# =====================================================================
# Test profile (SPEC.md sections 5 and 6), activated by @ActiveProfiles("test").
# Spring Boot loads src/main/resources/application.properties first and then
# this file, so only the settings below are overridden. Everything else,
# including ${MYSQL_USER}, ${MYSQL_PASSWORD} and ${JWT_SECRET} from
# application-local.properties, is inherited. No secrets belong in this file.
# =====================================================================

# Point the tests at the separate auth_test database so test runs never
# change the real auth data. Same local-development-only options as the main URL.
spring.datasource.url=jdbc:mysql://localhost:3306/auth_test?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC

# "create-drop": build a fresh users table when the tests start and drop it when
# they finish, so every test run begins from a clean, known schema.
spring.jpa.hibernate.ddl-auto=create-drop
